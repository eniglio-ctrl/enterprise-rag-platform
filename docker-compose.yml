services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-ragplatform}
      POSTGRES_USER: ${DB_USER:-ragplatform}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ragplatform}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-pgvector/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ragplatform} -d ${DB_NAME:-ragplatform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    environment:
      ASR_MODEL: base
      ASR_ENGINE: openai_whisper
    ports:
      - "9000:9000"
    volumes:
      - whisper-data:/root/.cache/whisper
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports:
      - "8084:8084"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ragplatform}
      DB_USER: ${DB_USER:-ragplatform}
      DB_PASSWORD: ${DB_PASSWORD:-ragplatform}
      WEB_UI_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  ingestion-service:
    build:
      context: .
      dockerfile: ingestion-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ragplatform}
      DB_USER: ${DB_USER:-ragplatform}
      DB_PASSWORD: ${DB_PASSWORD:-ragplatform}
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDING_MODEL: nomic-embed-text
      VISION_MODEL: llava
      WHISPER_BASE_URL: http://whisper:9000
      AUTH_SERVICE_BASE_URL: http://auth-service:8084
      WEB_UI_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      whisper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  rag-service:
    build:
      context: .
      dockerfile: rag-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ragplatform}
      DB_USER: ${DB_USER:-ragplatform}
      DB_PASSWORD: ${DB_PASSWORD:-ragplatform}
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDING_MODEL: nomic-embed-text
      CHAT_MODEL: llama3.1
      AUTH_SERVICE_BASE_URL: http://auth-service:8084
      WEB_UI_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      # rag-service runs with initialize-schema=false, so ingestion-service
      # must be the one to create the pgvector table first.
      ingestion-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  chat-service:
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ragplatform}
      DB_USER: ${DB_USER:-ragplatform}
      DB_PASSWORD: ${DB_PASSWORD:-ragplatform}
      OLLAMA_BASE_URL: http://ollama:11434
      CHAT_MODEL: llama3.1
      RAG_SERVICE_BASE_URL: http://rag-service:8082
      AUTH_SERVICE_BASE_URL: http://auth-service:8084
      WEB_UI_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      rag-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  web-ui:
    build:
      context: ./web-ui
    ports:
      - "3000:80"
    depends_on:
      - auth-service
      - ingestion-service
      - rag-service
      - chat-service
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - auth-service
      - ingestion-service
      - rag-service
      - chat-service
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  ollama-data:
  whisper-data:
  prometheus-data:
  grafana-data:
