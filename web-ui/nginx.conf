server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security Phase 3 (ADR 0021/0029): mermaid@11 loads from jsdelivr (script-src),
    # and its rendered SVG diagrams carry inline style="..." attributes (style-src
    # 'unsafe-inline' - confirmed necessary by actually asking a diagram question
    # against this exact policy in a real browser before finalizing, not assumed
    # from Mermaid's docs). connect-src lists every backend this local docker-compose
    # web-ui talks to directly from the browser (auth/ingestion/rag ports) - the
    # public demo (Netlify) is a separate static deployment, out of scope here,
    # covered by Security Phase 6 instead.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:8081 http://localhost:8082 http://localhost:8083 http://localhost:8084; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # No content hashing in this static, no-build-step web-ui, so every
    # deploy reuses the same index.html/style.css/app.js URLs. Without
    # no-cache, browsers (and this project's own tooling) can keep serving
    # a stale mix of old CSS/JS against a freshly deployed HTML shell.
    # nginx note: add_header in a location resets (does not merge with)
    # the server-level add_header list, so the security headers above are
    # repeated here rather than silently dropped for html/css/js requests.
    location ~* \.(?:html|css|js)$ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:8081 http://localhost:8082 http://localhost:8083 http://localhost:8084; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
