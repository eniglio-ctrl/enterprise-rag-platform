apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: rag-platform
spec:
  selector:
    app: chat-service
  ports:
    - port: 8083
      targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: rag-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      initContainers:
        - name: wait-for-postgres-and-ollama
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done
              until nc -z ollama 11434; do echo waiting for ollama; sleep 2; done
        - name: wait-for-rag-service
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- http://rag-service:8082/actuator/health | grep -q '"status":"UP"'; do
                echo waiting for rag-service
                sleep 3
              done
      containers:
        - name: chat-service
          image: rag-platform/chat-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: rag-platform-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: rag-platform-db-credentials
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rag-platform-db-credentials
                  key: DB_PASSWORD
          # See ingestion-service.yaml — startupProbe absorbs the first-boot Ollama
          # model pull so liveness doesn't kill the container mid-pull.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            periodSeconds: 20
          resources:
            requests:
              memory: "384Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
