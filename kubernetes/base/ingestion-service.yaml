apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
  namespace: rag-platform
spec:
  selector:
    app: ingestion-service
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
  namespace: rag-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion-service
  template:
    metadata:
      labels:
        app: ingestion-service
    spec:
      initContainers:
        - name: wait-for-postgres-and-ollama
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done
              until nc -z ollama 11434; do echo waiting for ollama; sleep 2; done
      containers:
        - name: ingestion-service
          image: rag-platform/ingestion-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: rag-platform-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: rag-platform-db-credentials
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rag-platform-db-credentials
                  key: DB_PASSWORD
          # First boot pulls its Ollama model (pull-model-strategy: when_missing)
          # against a possibly-empty ollama-0 volume — this can outlast a short
          # liveness delay and get the container killed mid-pull (confirmed: rag-service
          # restarted once on a fresh cluster before this probe was added). startupProbe
          # suspends liveness/readiness until it passes, so slow first boots don't
          # crash-loop; readiness/liveness below only govern steady-state behavior.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 20
          resources:
            requests:
              memory: "384Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
