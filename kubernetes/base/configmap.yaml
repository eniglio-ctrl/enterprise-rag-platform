apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-platform-config
  namespace: rag-platform
data:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ragplatform
  OLLAMA_BASE_URL: http://ollama:11434
  EMBEDDING_MODEL: nomic-embed-text
  CHAT_MODEL: llama3.1
  RAG_SERVICE_BASE_URL: http://rag-service:8082
  # Matches the Ingress host (ingress.yaml) — only relevant if a caller reaches the
  # platform through it. For `kubectl port-forward web-ui`, the browser hits
  # localhost directly and this value doesn't matter to CORS at all.
  WEB_UI_ORIGIN: http://rag-platform.local
