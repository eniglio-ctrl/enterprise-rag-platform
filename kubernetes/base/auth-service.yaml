apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: rag-platform
spec:
  selector:
    app: auth-service
  ports:
    - port: 8084
      targetPort: 8084
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: rag-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      initContainers:
        # No Ollama dependency, unlike the other three Java services — auth-service
        # never calls an LLM, only Postgres, mirroring its docker-compose depends_on.
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done
      containers:
        - name: auth-service
          image: rag-platform/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: rag-platform-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: rag-platform-db-credentials
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rag-platform-db-credentials
                  key: DB_PASSWORD
          # No startupProbe, unlike the other three Java services — that pattern exists
          # specifically to absorb a slow first-boot Ollama model pull racing the
          # liveness probe (see rag-service.yaml); auth-service never touches Ollama,
          # so its boot time doesn't have that failure mode.
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            periodSeconds: 20
          resources:
            requests:
              memory: "384Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
