apiVersion: v1
kind: Service
metadata:
  name: web-ui
  namespace: rag-platform
spec:
  selector:
    app: web-ui
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
  namespace: rag-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-ui
  template:
    metadata:
      labels:
        app: web-ui
    spec:
      # No initContainer wait here, matching docker-compose's own web-ui depends_on
      # (a plain ordering hint, not condition: service_healthy) — nginx serves static
      # assets regardless of backend readiness; API calls just fail until they're up.
      containers:
        - name: web-ui
          image: rag-platform/web-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
