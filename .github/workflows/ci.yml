name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # `secrets` can't be referenced directly in a step's `if:` (GitHub
      # Actions rejects the whole workflow file as invalid if you try) -
      # this job-level env is the documented workaround, checked via
      # `env.SONAR_TOKEN` below instead.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, not the default shallow clone - SonarCloud's new-code
          # analysis (below) needs it to diff against a real base, not a
          # single commit.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw -B clean verify

      - name: Cache SonarCloud packages
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarCloud analysis
        # Guarded on the secret existing so CI stays green (this step just
        # doesn't run) until SONAR_TOKEN is actually added as a repo secret -
        # see docs/adr/0027-sonarcloud-jacoco-code-quality.md.
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
