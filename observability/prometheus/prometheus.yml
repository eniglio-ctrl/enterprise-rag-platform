global:
  scrape_interval: 10s

scrape_configs:
  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:8084"]

  - job_name: ingestion-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ingestion-service:8081"]

  - job_name: rag-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["rag-service:8082"]

  - job_name: chat-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["chat-service:8083"]
